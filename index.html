<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub 加速地址</title>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>GitHub 加速地址</h1>
        <p class="app-subtitle">粘贴 GitHub 源地址，一行一条，得到可用的加速地址。</p>
      </header>

      <label class="input-label" for="source-input">源地址</label>
      <textarea
        id="source-input"
        class="source-input"
        rows="6"
        spellcheck="false"
        placeholder="https://raw.githubusercontent.com/{owner}/{repo}/{ref}/{path}"
      ></textarea>

      <label class="toggle" for="jsdelivr-fallbacks">
        <input id="jsdelivr-fallbacks" class="toggle-input" type="checkbox" />
        <span>显示 jsDelivr 备用入口（fastly / gcore / testingcf）</span>
      </label>

      <div class="toolbar">
        <button id="copy-all" class="action action-copy" type="button" disabled>
          复制全部
        </button>
      </div>

      <section id="cards" class="cards" aria-live="polite"></section>

      <section class="matrix-section" aria-labelledby="matrix-title">
        <h2 id="matrix-title" class="matrix-title">服务支持矩阵</h2>
        <p class="matrix-hint">
          8 个主服务 × 4 类源类型。jsDelivr 的三个备用入口与 cdn.jsdelivr.net 能力相同，不单独列出。
          ✓ 支持，— 不支持；窄屏可左右滑动表格查看全部列。
        </p>
        <div id="matrix"></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
